<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Videographer Scheduler{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <nav class="bg-slate-900 text-white">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="/" class="flex items-center gap-2 font-bold text-lg">
                <span class="text-2xl">🏒</span>
                <span>Shoot Scheduler</span>
            </a>
            <div class="flex items-center gap-4 text-sm">
                <a href="/" class="hover:text-blue-300 transition">Videographers</a>
                <a href="/edits/" class="hover:text-blue-300 transition">Editors</a>
                <a href="/shoots/" class="hover:text-blue-300 transition">All Shoots</a>
                <a href="/admin/" class="hover:text-blue-300 transition">Admin</a>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-xs text-slate-400 py-6">
        Puck Pro Media · Automated assignment
    </footer>
</body>
</html>
